<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x86db explorer</title>
<link rel="stylesheet" href="/static/explorer.css">
</head>
<body data-view="state">
<nav>
  <a id="home" href="/"><b>x86db explorer</b></a><span id="crumbs"></span>
  <span class="right"><a href="/checks">checks</a></span>
</nav>
<p id="error" class="banner" hidden></p>

<main id="page" hidden>
<p id="banner" class="banner" hidden></p>

<h1><code id="insn"></code></h1>
<p id="about"></p>

<h2 id="state"></h2>
<p><a id="toggle"></a> · <a id="json">json</a></p>
<p id="inexact" class="banner" hidden>
  This browser reads integers above 2<sup>53</sup> inexactly: the low digits of such values are wrong
  here. The json link has the exact values.
</p>

<div id="values" class="scroll" hidden>
  <table class="state">
    <thead><tr id="state-head"></tr></thead>
    <tbody id="state-rows"></tbody>
  </table>
</div>
<p id="none" hidden>No model has a mismatch on this state.</p>
<ul id="others"></ul>
</main>

<script src="/static/explorer.js"></script>
</body>
</html>
