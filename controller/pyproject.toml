[project]
name = "controller"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "iced-x86>=1.21.0",
    "psycopg[binary,pool]>=3.3.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[project.scripts]
controller = "controller.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controller"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
